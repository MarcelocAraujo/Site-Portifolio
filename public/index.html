<!doctype html>
<html lang="pt-BR" style="background-color: #0a0a0a">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <!-- viewport-fit=cover: o site ocupa a tela inteira, inclusive atrás das barras do celular -->
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <!-- Cor que o Safari/Chrome usam para pintar as barras de cima e de baixo -->
    <meta name="theme-color" content="#0a0a0a" />
    <meta name="color-scheme" content="dark light" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="Portfólio de Marcelo Caldas, estudante de Ciência da Computação: projetos, formação, stacks e um Jogo da Forca." />
    <title>Marcelo Caldas — Portfólio</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
        /* Fundo da página (aparece nas bordas e atrás das barras do navegador) */
        background-color: #0a0a0a;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        margin: 0;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript> Você precisa ativar o JavaScript para ver este site. </noscript>
    <div id="root"></div>
  </body>
</html>
